<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Newsletter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .container {
            background: #fff;
            padding: 30px;
            width: 350px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            font-size: 14px;
            font-weight: 600;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            width: 100%;
            background-color: #407093;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #345876;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Stop guessing</h2>
        <p>Get access to 9 proven tactics to grow your email list faster. Templates included.</p>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">
        <div class="checkbox-container">
            <input type="checkbox" id="subscribe">
            <label for="subscribe">Receive weekly marketing insights</label>
        </div>
        <button class="btn">GET CHEAT SHEET</button>
    </div>
</body>
</html>
